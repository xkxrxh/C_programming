<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --page-bg:#dfe4df;
    --page-ink:#2a332d;
    --shell:#26302b;
    --shell-edge:#1a221e;
    --screen:#15201b;
    --screen-ink:#a6d8b8;
    --screen-dim:#5f8a72;
    --key:#e9e6dd;
    --key-ink:#222924;
    --key-op:#3d4f47;
    --key-op-ink:#e9e6dd;
    --key-fn:#c9c6bc;
    --accent:#e8a020;
    --accent-ink:#2a1d05;
    --tape-ink:#5c6a61;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --page-bg:#10140f;
      --page-ink:#c9d2cb;
      --tape-ink:#8b998f;
    }
  }
  :root[data-theme="dark"]{
    --page-bg:#10140f;
    --page-ink:#c9d2cb;
    --tape-ink:#8b998f;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    background:var(--page-bg);
    color:var(--page-ink);
    font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:28px 16px 40px;
  }

  .machine{
    width:100%;
    max-width:340px;
    background:var(--shell);
    border-radius:20px;
    padding:16px;
    border:1px solid var(--shell-edge);
    box-shadow:0 18px 40px -22px rgba(0,0,0,.75);
  }

  .screen{
    background:var(--screen);
    border-radius:12px;
    padding:16px 16px 12px;
    text-align:right;
    position:relative;
    overflow:hidden;
  }
  .expr{
    font-family:"IBM Plex Mono",monospace;
    font-size:.8rem;
    color:var(--screen-dim);
    min-height:1.2em;
    letter-spacing:.02em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    direction:rtl;
  }
  .out{
    font-family:"IBM Plex Mono",monospace;
    font-weight:500;
    color:var(--screen-ink);
    font-size:2.4rem;
    line-height:1.15;
    margin-top:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    direction:rtl;
  }

  .pad{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:14px;
  }
  button{
    font-family:inherit;
    font-size:1.1rem;
    font-weight:500;
    border:0;
    border-radius:11px;
    padding:14px 0;
    background:var(--key);
    color:var(--key-ink);
    cursor:pointer;
    transition:transform .06s ease, filter .12s ease;
  }
  button:hover{filter:brightness(1.05)}
  button:active{transform:translateY(2px)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .fn{background:var(--key-fn)}
  .op{background:var(--key-op);color:var(--key-op-ink);font-size:1.25rem}
  .eq{background:var(--accent);color:var(--accent-ink)}
  .wide{grid-column:span 2}

  .tape{
    width:100%;
    max-width:340px;
    font-family:"IBM Plex Mono",monospace;
    font-size:.78rem;
    color:var(--tape-ink);
    line-height:1.9;
    text-align:right;
  }
  .tape p{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hint{
    font-size:.75rem;
    color:var(--tape-ink);
    text-align:center;
    max-width:340px;
  }
  @media (prefers-reduced-motion:reduce){
    button{transition:none}
  }
</style>
</head>
<body>

  <div class="machine">
    <div class="screen">
      <div class="expr" id="expr"></div>
      <div class="out" id="out">0</div>
    </div>

    <div class="pad" id="pad">
      <button class="fn" data-act="clear">AC</button>
      <button class="fn" data-act="back">⌫</button>
      <button class="fn" data-act="percent">%</button>
      <button class="op" data-act="op" data-val="/">÷</button>

      <button data-act="num" data-val="7">7</button>
      <button data-act="num" data-val="8">8</button>
      <button data-act="num" data-val="9">9</button>
      <button class="op" data-act="op" data-val="*">×</button>

      <button data-act="num" data-val="4">4</button>
      <button data-act="num" data-val="5">5</button>
      <button data-act="num" data-val="6">6</button>
      <button class="op" data-act="op" data-val="-">−</button>

      <button data-act="num" data-val="1">1</button>
      <button data-act="num" data-val="2">2</button>
      <button data-act="num" data-val="3">3</button>
      <button class="op" data-act="op" data-val="+">+</button>

      <button data-act="sign">±</button>
      <button data-act="num" data-val="0">0</button>
      <button data-act="dot">.</button>
      <button class="eq" data-act="equals">=</button>
    </div>
  </div>

  <div class="tape" id="tape"></div>
  <p class="hint">Your keyboard works too: numbers, + − * /, Enter, Backspace, Escape.</p>

<script>
(function () {
  const outEl  = document.getElementById('out');
  const exprEl = document.getElementById('expr');
  const tapeEl = document.getElementById('tape');

  const SYM = { '+': '+', '-': '−', '*': '×', '/': '÷' };

  let cur   = '0';    // what's being typed
  let acc   = null;   // stored left-hand value
  let op    = null;   // pending operator
  let fresh = true;   // next digit starts a new number

  function format(n) {
    if (!isFinite(n)) return 'Error';
    const rounded = Number(n.toPrecision(12));
    return String(rounded);
  }

  function render() {
    outEl.textContent = cur;
    exprEl.textContent = acc === null ? '' : format(acc) + ' ' + SYM[op];
  }

  function inputDigit(d) {
    if (fresh) { cur = d; fresh = false; }
    else if (cur === '0') { cur = d; }
    else if (cur.replace('-', '').replace('.', '').length < 12) { cur += d; }
    render();
  }

  function inputDot() {
    if (fresh) { cur = '0.'; fresh = false; }
    else if (!cur.includes('.')) { cur += '.'; }
    render();
  }

  function backspace() {
    if (fresh) return;
    cur = cur.length > 1 ? cur.slice(0, -1) : '0';
    if (cur === '-') cur = '0';
    render();
  }

  function clearAll() {
    cur = '0'; acc = null; op = null; fresh = true;
    render();
  }

  function toggleSign() {
    if (cur === '0') return;
    cur = cur.startsWith('-') ? cur.slice(1) : '-' + cur;
    render();
  }

  function percent() {
    const v = parseFloat(cur) / 100;
    cur = format(acc !== null && (op === '+' || op === '-') ? acc * v : v);
    fresh = false;
    render();
  }

  function compute(a, b, o) {
    switch (o) {
      case '+': return a + b;
      case '-': return a - b;
      case '*': return a * b;
      case '/': return b === 0 ? NaN : a / b;
    }
    return b;
  }

  function setOp(next) {
    const v = parseFloat(cur);
    if (op !== null && !fresh) {
      const r = compute(acc, v, op);
      acc = r;
      cur = format(r);
    } else {
      acc = v;
    }
    op = next;
    fresh = true;
    render();
  }

  function equals() {
    if (op === null) return;
    const v = parseFloat(cur);
    const r = compute(acc, v, op);
    logTape(format(acc) + ' ' + SYM[op] + ' ' + format(v) + ' = ' + format(r));
    cur = format(r);
    acc = null; op = null; fresh = true;
    render();
  }

  function logTape(line) {
    const p = document.createElement('p');
    p.textContent = line;
    tapeEl.prepend(p);
    while (tapeEl.children.length > 5) tapeEl.lastChild.remove();
  }

  document.getElementById('pad').addEventListener('click', function (e) {
    const b = e.target.closest('button');
    if (!b) return;
    const act = b.dataset.act, val = b.dataset.val;
    if (cur === 'Error' && act !== 'clear') clearAll();
    if (act === 'num') inputDigit(val);
    else if (act === 'op') setOp(val);
    else if (act === 'dot') inputDot();
    else if (act === 'equals') equals();
    else if (act === 'clear') clearAll();
    else if (act === 'back') backspace();
    else if (act === 'sign') toggleSign();
    else if (act === 'percent') percent();
  });

  document.addEventListener('keydown', function (e) {
    const k = e.key;
    if (/^[0-9]$/.test(k)) { inputDigit(k); flash('[data-val="' + k + '"]'); }
    else if ('+-*/'.includes(k)) { setOp(k); flash('[data-val="' + CSS.escape(k) + '"]'); }
    else if (k === 'Enter' || k === '=') { e.preventDefault(); equals(); flash('.eq'); }
    else if (k === 'Backspace') { backspace(); }
    else if (k === 'Escape') { clearAll(); }
    else if (k === '.' || k === ',') { inputDot(); }
    else if (k === '%') { percent(); }
  });

  function flash(sel) {
    const b = document.querySelector('#pad ' + sel);
    if (!b) return;
    b.style.filter = 'brightness(1.25)';
    setTimeout(function () { b.style.filter = ''; }, 90);
  }

  render();
})();
</script>
</body>
</html>
